[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-metrics"
# See RELEASING.md
version = "0.1.0"
description = "Evaluation metrics for phone segmentation and recognition, decoupled from the models that produce them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen McIntosh", email="stephenmac7@gmail.com" }]
keywords = ["speech", "phone", "phoneme", "segmentation", "evaluation", "r-value", "per"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "panphon>=0.22.2",
    "praatio>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit",
]

[project.scripts]
# Namespaced: console scripts land on PATH globally.
phone-metrics-prepare-buckeye = "phone_metrics.prepare_buckeye:main"

[project.urls]
Homepage = "https://github.com/stephenmac7/phone-metrics"
Repository = "https://github.com/stephenmac7/phone-metrics"
Issues = "https://github.com/stephenmac7/phone-metrics/issues"

[tool.setuptools.packages.find]
include = ["phone_metrics*"]

[tool.setuptools.package-data]
phone_metrics = ["py.typed", "buckeye-mfa.patch"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
